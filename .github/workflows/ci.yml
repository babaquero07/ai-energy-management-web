name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    env:
      # Repository variables. Si no existen, el build usa la URL local de la API.
      # NEXT_PUBLIC_API_URL queda compilada en el cliente: cámbiala y vuelve a construir.
      API_URL: ${{ vars.API_URL || 'http://localhost:3000/api' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm y Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.1.1
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
